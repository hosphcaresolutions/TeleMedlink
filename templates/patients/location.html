{% extends 'patients/base.html' %}
{% block title %}Location{% endblock title %}

{% block page_title %}Patient Location{% endblock page_title %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow p-4">
        <h3 class="text-center mb-3">Your Current Location</h3>
        <div id="map"></div>
        <p id="error-message" class="text-danger text-center mt-2"></p>
    </div>
</div>

<!-- Leaflet.js CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    #map {
        width: 100%;
        height: 500px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
</style>

<!-- Leaflet.js JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var map = L.map('map').setView([0, 0], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById("error-message").textContent = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            map.setView([lat, lon], 13);

            L.marker([lat, lon]).addTo(map)
                .bindPopup("You are here")
                .openPopup();
        }

        function showError(error) {
            const errorMessage = {
                1: "User denied location access.",
                2: "Location information unavailable.",
                3: "Request to get user location timed out.",
                4: "An unknown error occurred."
            };
            document.getElementById("error-message").textContent = errorMessage[error.code] || "An error occurred.";
        }

        getLocation();
    });
</script>
{% endblock content %}
