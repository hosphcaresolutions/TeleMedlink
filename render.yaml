services:
  - type: web
    name: telemedlink
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn hospital.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telemedlink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: telemedlink-db
    plan: free
